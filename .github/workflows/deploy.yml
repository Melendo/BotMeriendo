name: Deploy en self-hosted runner

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Igual que la imagen de Docker

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q src

      - name: Run tests
        run: pytest -q

  deploy:
    # Solo se despliega desde main y si los tests pasan
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Build and Deploy
        run: |
          # Detiene los contenedores, reconstruye la imagen y levanta en segundo plano
          docker compose up -d --build --force-recreate

          # Limpia imágenes antiguas para no llenar la SD de la Pi
          docker image prune -f
